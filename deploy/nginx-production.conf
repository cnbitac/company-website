# Active production configuration. Certificate managed by Certbot.
server {
    listen 80;
    server_name www.linkedti.com linkedti.com;
    return 301 https://www.linkedti.com$request_uri;
}

server {
    listen 443 ssl;
    server_name www.linkedti.com;
    ssl_certificate /etc/letsencrypt/live/www.linkedti.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.linkedti.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/linkedti/current;
    index index.html;
    charset utf-8;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    rewrite ^/(.+)/$ /$1 permanent;
    location = / { try_files /index.html =404; }
    location ~ /\. { deny all; }
    location /api/ {
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:8766;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Origin $http_origin;
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;
        add_header Cache-Control "no-store" always;
    }
    location / { try_files $uri $uri.html =404; }
}
