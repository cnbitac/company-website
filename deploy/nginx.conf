# Include this server block from nginx.conf's http context.
# Place the exported out/ contents under /var/www/linkedti/current/.
# Configure HTTPS with your domain certificate before the public launch.
server {
    listen 80;
    server_name linkedti.com www.linkedti.com;
    root /var/www/linkedti/current;
    index index.html;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;

    location ~ /\. { deny all; }
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
